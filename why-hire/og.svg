<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Chris McNosky — Why Hire Me</title>
  <desc id="desc">Technical project delivery, software quality, and AI evaluation. Find the problem. Verify the repair. I make difficult, unfamiliar problems solvable—and carry the work through to a result that holds up. Work accepted by Tokio and Grafana.</desc>
