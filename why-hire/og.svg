    <text x="80" y="407" fill="#71b7fb" font-family="Baskerville, 'Hoefler Text', Georgia, serif" font-size="30" font-weight="600">I make difficult, unfamiliar problems solvable—and carry</text>
    <path d="M386 460H658" stroke="#f3ab68" stroke-width="2.5"/>
    <text x="80" y="450" fill="#71b7fb" font-family="Baskerville, 'Hoefler Text', Georgia, serif" font-size="30" font-weight="600">the work through to a <tspan fill="#9ed5a3">result that holds up</tspan>.</text>
