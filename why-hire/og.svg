    <path d="M80 100H1200" stroke="#707a70" stroke-width="2"/>
    <text x="80" y="149" fill="#c4c8bf" font-size="26" font-weight="600">Technical project delivery · Software quality · AI evaluation</text>
    <text x="78" y="247" fill="#f3ab68" font-size="82" font-weight="750" letter-spacing="-2.5">Find the problem.</text>
